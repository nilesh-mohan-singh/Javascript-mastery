      background: white;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .highlight {
      color: white;
      background: teal;
      padding: 5px;

    button {
      margin-top: 15px;
      padding: 10px 15px;
      cursor: pointer;

</head>
<body>

  <h1 id="mainTitle">DOM Selection Methods Practice</h1>

  <div class="box sampleClass">

  </div>

  <p class="infoText">

    <li class="listItem">HTML</li>
    <li class="listItem">CSS</li>
    <li class="listItem">JavaScript</li>
  </ul>

  <button onclick="practiceDOM()">
    Run DOM Manipulation
  </button>
